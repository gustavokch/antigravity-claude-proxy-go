name: Secret scan

# Scans every push and pull request with trufflehog. Only verified (live) and
# unknown (verification failed) secrets fail the job; a secret trufflehog
# confirmed as revoked does not. The same policy runs locally through
# scripts/secret-scan.sh and the omp extension .omp/extensions/trufflehog.ts.

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  trufflehog:
    name: trufflehog
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan for secrets
        uses: trufflesecurity/trufflehog@e76dff8a7e57d6df0c60ad8cbf5d5cba505a8fc9 # v3.99.2
        with:
          extra_args: --results=verified,unknown
